# ─────────────────────────────────────────────────────────────────────────────
# Grafana Dashboard Provisioning
# Auto-loads JSON dashboards from /var/lib/grafana/dashboards
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: "OPRAI Dashboards"
    orgId: 1
    folder: "OPRAI"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
