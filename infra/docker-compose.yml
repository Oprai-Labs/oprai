# ─────────────────────────────────────────────────────────────────────────────
# OPRAI Full Stack - Polyglot Services + Infrastructure
# Usage: docker compose -f infra/docker-compose.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ============== Infrastructure ==============

  postgres:
    image: postgres:16-alpine
    container_name: oprai-postgres
    mem_limit: 8g
    pids_limit: 512
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=1536MB
      -c wal_level=replica
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c default_statistics_target=200
      -c idle_in_transaction_session_timeout=30000
      -c statement_timeout=60000
      -c log_min_duration_statement=200
      -c log_checkpoints=on
      -c log_lock_waits=on
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERPASS:?DB_SUPERPASS is required}
      POSTGRES_DB: ${DB_SUPERDB:-oprai}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer — connection pooler (transaction mode) ──────────────────────
  pgbouncer:
    # NOTE: edoburu/pgbouncer publishes only :latest tag; pin once a versioned
    # tag is published upstream. Last verified pull: 2025-12-20.
    # Pinned to the exact running image (was :latest — a floating tag that could
    # silently pull a changed/compromised image into this DB-adjacent component
    # on any rebuild). Digest is authoritative; the version tag is for humans.
    image: edoburu/pgbouncer:1.25.1@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b
    container_name: oprai-pgbouncer
    mem_limit: 256m
    pids_limit: 512
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${DB_SUPERUSER:-postgres}:${DB_SUPERPASS:?DB_SUPERPASS is required}@postgres:5432/${DB_SUPERDB:-oprai}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "10"
      SERVER_IDLE_TIMEOUT: "600"
      CLIENT_IDLE_TIMEOUT: "0"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits,application_name,search_path,options"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${DB_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: oprai-redis
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped
    # Require a password. Redis is bound to loopback, but a compromised container
    # on the docker network could otherwise read/tamper sessions, nonces and
    # rate-limit counters unauthenticated. --requirepass keeps the compiled
    # defaults for everything else (RDB persistence unchanged).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      # Only so the healthcheck below can authenticate; not read by redis itself.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: oprai-qdrant
    mem_limit: 4g
    pids_limit: 512
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__HARD_LIMIT: 10737418240
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # qdrant image has bash but not curl; bash /dev/tcp probes the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: oprai-prometheus
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: oprai-grafana
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # Loki keeps container logs on a persistent volume so they survive a
  # --force-recreate deploy (the json-file driver drops logs with the old
  # container). Internal-only: Grafana reaches it over infra_default; no host
  # port. 30-day retention (see loki/loki-config.yml).
  loki:
    image: grafana/loki:2.9.10
    container_name: oprai-loki
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  # Promtail discovers every oprai-* container over the Docker socket and ships
  # its stdout/stderr to Loki, labelled `service` (container name minus the
  # oprai- prefix): {service="chat-service-py"} |= "ERROR".
  promtail:
    image: grafana/promtail:2.9.10
    container_name: oprai-promtail
    mem_limit: 256m
    pids_limit: 512
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ============== Go Services ==============

  gateway-go:
    build:
      context: ../services/gateway-go
      dockerfile: Dockerfile
    container_name: oprai-gateway-go
    mem_limit: 512m
    pids_limit: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      GRPC_PORT: 50050
      # Marks the service as production so its fail-closed guards arm: refuse to
      # boot on a default/short JWT secret, internal key, or unreachable Redis.
      NODE_ENV: production
      OPRAI_JWT_SECRET: ${OPRAI_JWT_SECRET:?OPRAI_JWT_SECRET is required}
      OPRAI_INTERNAL_API_KEY: ${OPRAI_INTERNAL_API_KEY:?OPRAI_INTERNAL_API_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY_HEADERS: "true"
      AUTH_SERVICE_HTTP: http://auth-service-go:3010
      AUTH_SERVICE_GRPC: auth-service-go:50051
      CHAT_SERVICE_HTTP: http://chat-service-py:3020
      CHAT_SERVICE_GRPC: chat-service-py:50052
      SOLANA_SERVICE_HTTP: http://solana-service-rs:3030
      SOLANA_SERVICE_GRPC: solana-service-rs:50053
      MEMORY_SERVICE_HTTP: http://memory-service-py:3040
      MEMORY_SERVICE_GRPC: memory-service-py:50054
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Market-data upstream keys. Without these the gateway's MarketProxy runs
      # keyless: Helius getAsset silently falls through to the public RPC (which
      # doesn't index fresh pump.fun mints, so their names/logos never resolve),
      # and Birdeye/Jupiter calls are unauthenticated/rate-limited.
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      # EVM wallet portfolio (balances + prices, multichain). Unset -> the
      # /market/evm/portfolio endpoint returns "not configured".
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      # EVM DeFi positions (protocol-labeled, multichain). Unset -> the
      # /market/evm/positions endpoint returns "not configured".
      MORALIS_API_KEY: ${MORALIS_API_KEY:-}
      OPRAI_RPC_FALLBACKS: ${OPRAI_RPC_FALLBACKS:-}
      # Where uploaded token images and metadata JSON are written, and the
      # base URL they are served under. PUBLIC_BASE_URL becomes part of a
      # token's permanent on-chain URI, so it must be the public API domain —
      # the default (localhost:3001) would mint a token whose picture and name
      # nothing on the internet can fetch.
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.oprai.xyz}
    volumes:
      # Durable, not incidental: these files sit behind immutable on-chain
      # URIs. If the volume is lost, every token launched through OPRAI loses
      # its image and name everywhere they are displayed.
      - gateway-uploads:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      auth-service-go:
        condition: service_healthy
      chat-service-py:
        condition: service_healthy
      solana-service-rs:
        condition: service_healthy
      memory-service-py:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service-go:
    build:
      context: ../services/auth-service-go
      dockerfile: Dockerfile
    container_name: oprai-auth-service-go
    mem_limit: 512m
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "3010"
      - "50051"
    environment:
      PORT: 3010
      GRPC_PORT: 50051
      # Production mode: session cookie gets the Secure flag (HTTPS-only) and the
      # service refuses to boot on a default/short JWT secret or internal key.
      NODE_ENV: production
      OPRAI_JWT_SECRET: ${OPRAI_JWT_SECRET:?OPRAI_JWT_SECRET is required}
      OPRAI_INTERNAL_API_KEY: ${OPRAI_INTERNAL_API_KEY:?OPRAI_INTERNAL_API_KEY is required}
      DATABASE_URL: postgresql://auth_app:${AUTH_DB_PASS:?AUTH_DB_PASS is required}@postgres:5432/${DB_SUPERDB:-oprai}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Trust X-Forwarded-For / X-Real-IP from caddy+gateway so per-IP rate
      # limiting tracks real client IPs, not the shared proxy container IP.
      TRUST_PROXY_HEADERS: "true"
      # Enables Telegram identity linking (Login-Widget HMAC verification).
      # Unset -> Telegram linking returns "not configured". Secret lives in .env.
      OPRAI_TELEGRAM_BOT_TOKEN: ${OPRAI_TELEGRAM_BOT_TOKEN:-}
      # Canonical host for the domain-bound login message (EIP-4361/SIWS). When
      # set, /auth/verify requires the signed message to carry this domain, so a
      # signature phished on another origin can't be replayed here.
      APP_DOMAIN: ${APP_DOMAIN:-app.oprai.xyz}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3010/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-service-go:
    build:
      context: ../services/admin-service-go
      dockerfile: Dockerfile
    container_name: oprai-admin-service-go
    mem_limit: 512m
    pids_limit: 512
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3050"
    expose:
      - "50055"
    environment:
      PORT: 3050
      GRPC_PORT: 50055
      # Production mode: admin session cookie gets the Secure flag, and the
      # service refuses to boot on a default/short admin JWT secret or if any
      # admin row still carries a known-weak password (e.g. admin123).
      NODE_ENV: production
      OPRAI_ADMIN_JWT_SECRET: ${OPRAI_ADMIN_JWT_SECRET:?OPRAI_ADMIN_JWT_SECRET is required}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-http://localhost:3200}
      DATABASE_URL: postgresql://admin_app:${ADMIN_DB_PASS:?ADMIN_DB_PASS is required}@postgres:5432/${DB_SUPERDB:-oprai}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3050/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      pgbouncer:
        condition: service_healthy

  # ============== Python Services ==============

  chat-service-py:
    build:
      context: ../services/chat-service-py
      dockerfile: Dockerfile
    container_name: oprai-chat-service-py
    mem_limit: 1500m
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "3020"
      - "50052"
    environment:
      PORT: 3020
      GRPC_PORT: 50052
      GRPC_HOST: 0.0.0.0
      OPRAI_JWT_SECRET: ${OPRAI_JWT_SECRET:?OPRAI_JWT_SECRET is required}
      OPRAI_INTERNAL_API_KEY: ${OPRAI_INTERNAL_API_KEY:?OPRAI_INTERNAL_API_KEY is required}
      # asyncpg driver — chat-service-py uses SQLAlchemy async engine
      DATABASE_URL: postgresql+asyncpg://chat_app:${CHAT_DB_PASS:?CHAT_DB_PASS is required}@postgres:5432/${DB_SUPERDB:-oprai}
      OPRAI_LLM_PROVIDER: ${OPRAI_LLM_PROVIDER:-openai}
      OPRAI_OPENAI_API_KEY: ${OPRAI_OPENAI_API_KEY:-}
      OPRAI_ANTHROPIC_API_KEY: ${OPRAI_ANTHROPIC_API_KEY:-}
      OPRAI_RESPONDER_MODEL_OPENAI: ${OPRAI_RESPONDER_MODEL_OPENAI:-gpt-4o-mini}
      OPRAI_RESPONDER_MODEL_ANTHROPIC: ${OPRAI_RESPONDER_MODEL_ANTHROPIC:-claude-haiku-4-5}
      OPRAI_RESPONDER_FALLBACK_MODEL_OPENAI: ${OPRAI_RESPONDER_FALLBACK_MODEL_OPENAI:-gpt-4o-mini}
      # Cost caps stay at code defaults (per-chat 500k). When a chat hits the
      # cap it emits a chat_limit event and the composer shows "start a new
      # chat" — tunable via .env if ever needed.
      OPRAI_LLM_CHAT_TOKEN_CAP: ${OPRAI_LLM_CHAT_TOKEN_CAP:-500000}
      OPRAI_LLM_DAILY_TOKEN_CAP: ${OPRAI_LLM_DAILY_TOKEN_CAP:-1500000}
      MEMORY_SERVICE_URL: http://memory-service-py:3040
      # Server-side on-chain reads (/actions/build) hit the Solana service
      # DIRECTLY — the gateway's /actions/* is browser-facing (CSRF + user JWT)
      # and rejects internal service-to-service calls.
      SOLANA_SERVICE_URL: http://solana-service-rs:3030
      MEMORY_SERVICE_GRPC: memory-service-py:50054
      GATEWAY_URL: http://gateway-go:3001
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379}
      SOLANA_RPC: ${SOLANA_RPC:-https://api.mainnet-beta.solana.com}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      # EVM cashback treasury hot-wallet key (native-token payouts). Unset ->
      # EVM claims stay disabled ("not enabled yet"), never a crash. The secret
      # lives only in infra/.env, never in this file or the repo.
      EVM_CASHBACK_TREASURY_KEY: ${EVM_CASHBACK_TREASURY_KEY:-}
      # Lighter agent-key encryption (Fernet). Unset -> derived from JWT secret
      # (works, but a dedicated key is preferred). MUST stay stable once any user
      # has onboarded, or stored agent keys become undecryptable. Secret lives
      # only in infra/.env, never in this file or the repo.
      OPRAI_LIGHTER_ENC_KEY: ${OPRAI_LIGHTER_ENC_KEY:-}
    # `python -m app.main` loads main.py as __main__, then uvicorn re-imports it
    # as app.main, double-registering Prometheus Counters. `python -m uvicorn`
    # only loads app.main once.
    #
    # `alembic upgrade head` is part of the command, not a nicety. The
    # Dockerfile's CMD runs it; this override replaced that CMD wholesale and
    # dropped it, so migrations silently stopped applying on deploy — prod ran
    # two revisions behind for months and the third (chat_session_shares) had
    # to be applied by hand before the feature that needed it would work.
    # Anything that overrides this command must carry the upgrade with it.
    command: ["sh", "-c", "alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 3020"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3020/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      pgbouncer:
        condition: service_healthy

  memory-service-py:
    build:
      context: ../services/memory-service-py
      dockerfile: Dockerfile
    container_name: oprai-memory-service-py
    mem_limit: 1500m
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "3040"
      - "50054"
    environment:
      PORT: 3040
      GRPC_PORT: 50054
      GRPC_HOST: 0.0.0.0
      OPRAI_JWT_SECRET: ${OPRAI_JWT_SECRET:?OPRAI_JWT_SECRET is required}
      OPRAI_INTERNAL_API_KEY: ${OPRAI_INTERNAL_API_KEY:?OPRAI_INTERNAL_API_KEY is required}
      # asyncpg driver — memory-service-py uses SQLAlchemy async engine
      DATABASE_URL: postgresql+asyncpg://memory_app:${MEMORY_DB_PASS:?MEMORY_DB_PASS is required}@postgres:5432/${DB_SUPERDB:-oprai}
      QDRANT_URL: http://qdrant:6333
      OPRAI_OPENAI_API_KEY: ${OPRAI_OPENAI_API_KEY:-}
    # See chat-service-py — same rationale, and the same migration step. This
    # service happened to be at head, so the dropped upgrade had not bitten
    # yet; the next memory migration would have been the one to go missing.
    command: ["sh", "-c", "alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 3040"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3040/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      pgbouncer:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ============== Rust Service ==============

  solana-service-rs:
    build:
      context: ..
      dockerfile: services/solana-service-rs/Dockerfile
    container_name: oprai-solana-service-rs
    mem_limit: 512m
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "3030"
      - "50053"
    environment:
      PORT: 3030
      GRPC_PORT: 50053
      # Inside docker network — bind 0.0.0.0 so other containers can reach
      BIND_HOST: 0.0.0.0
      GRPC_BIND_HOST: 0.0.0.0
      OPRAI_JWT_SECRET: ${OPRAI_JWT_SECRET:?OPRAI_JWT_SECRET is required}
      OPRAI_INTERNAL_API_KEY: ${OPRAI_INTERNAL_API_KEY:?OPRAI_INTERNAL_API_KEY is required}
      DATABASE_URL: postgresql://solana_app:${SOLANA_DB_PASS:?SOLANA_DB_PASS is required}@postgres:5432/${DB_SUPERDB:-oprai}
      SOLANA_RPC: ${SOLANA_RPC:-https://api.mainnet-beta.solana.com}
      # Where OPRAI's cut of a trade is sent. Empty = no fee is taken on any
      # path, which is exactly how the service behaved before commissions.
      OPRAI_FEE_WALLET: ${OPRAI_FEE_WALLET:-}
      # Hot wallet that pays cashback claims (SOL). Keep it funded with only a
      # small float; the fee wallet stays cold. Value lives in infra/.env only.
      OPRAI_CASHBACK_TREASURY_SECRET: ${OPRAI_CASHBACK_TREASURY_SECRET:-}
      SOLANA_NETWORK: ${SOLANA_NETWORK:-mainnet-beta}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      # Reads are public; every Magic Eden /instructions/* endpoint — buy,
      # list, offer, cancel, escrow — answers 401 without this.
      MAGIC_EDEN_API_KEY: ${MAGIC_EDEN_API_KEY:-}
      # Both were set in .env and neither reached the container, which is why
      # the two key-gated Relay calls answered "RELAY_API_KEY is not
      # configured" while the key sat one file away. A value in .env that no
      # service block forwards is not configuration, it is a note to yourself.
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      # Uniswap Trading API key (same-chain EVM swaps). Server-side only; the
      # integrator fee (flat 0.50%) is configured on the key at Uniswap's
      # dashboard, recipient = our EVM fee wallet. Unset → Uniswap swaps return
      # "UNISWAP_API_KEY is not configured".
      UNISWAP_API_KEY: ${UNISWAP_API_KEY:-}
      # Alchemy RPC (EVM eth_call) — reading a Uniswap V3 pool's fee/tickSpacing/
      # current tick when building an add-liquidity position. Unset → LP add
      # returns "Adding liquidity isn't available on <chain> yet."
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      RELAY_FEE_RECIPIENT: ${RELAY_FEE_RECIPIENT:-}
      # Cashback share of the Relay app fee is split off to this pool at collection
      # (the wallet that also pays claims → self-funding). Unset → whole fee to profit.
      RELAY_CASHBACK_RECIPIENT: ${RELAY_CASHBACK_RECIPIENT:-}
      AUTH_SERVICE_HTTP: http://auth-service-go:3010
      # SDK-only actions (Kamino Multiply/Liquidity, farms, Streamflow, …) and
      # some read queries are delegated to the TS sidecar. Read path uses
      # STREAMFLOW_SDK_URL; action-build path uses SOLANA_TS_SERVICE_URL.
      STREAMFLOW_SDK_URL: http://solana-service-ts:3031
      SOLANA_TS_SERVICE_URL: http://solana-service-ts:3031
    healthcheck:
      # solana-service-rs runtime is debian-slim without wget/curl; bash /dev/tcp probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3030"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pgbouncer:
        condition: service_healthy
      solana-service-ts:
        condition: service_started

  # ============== TypeScript Sidecar (SDK-only protocol actions) ==============
  solana-service-ts:
    build:
      context: ..
      dockerfile: services/solana-service-ts/Dockerfile
    container_name: oprai-solana-service-ts
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "3031"
    environment:
      PORT: 3031
      NODE_ENV: production
      OPRAI_INTERNAL_API_KEY: ${OPRAI_INTERNAL_API_KEY:?OPRAI_INTERNAL_API_KEY is required}
      DATABASE_URL: postgresql://solana_app:${SOLANA_DB_PASS:?SOLANA_DB_PASS is required}@postgres:5432/${DB_SUPERDB:-oprai}
      SOLANA_RPC: ${SOLANA_RPC:-https://api.mainnet-beta.solana.com}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.oprai.xyz}
    healthcheck:
      # node:20-slim has no wget/curl — probe /health with an inline node http get.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3031/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # ============== Frontend (Angular SPA served by nginx) ==============
  frontend:
    build:
      context: ../apps/oprai
      dockerfile: Dockerfile
    container_name: oprai-frontend
    mem_limit: 256m
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      # nginx:alpine ships with wget (busybox); use 127.0.0.1 to avoid IPv6 mismatch
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-uploads:
  postgres-data:
  redis-data:
  qdrant-storage:
  prometheus-data:
  grafana-data:
  loki-data:
