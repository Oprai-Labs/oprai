# Promtail — ships every Docker container's stdout/stderr to Loki.
#
# Labels every line with `service` (the container name minus the
# `oprai-` prefix) so a Grafana query can filter to one service:
#
#     {service="chat"} |= "ERROR"
#
# To add structured-log parsing (e.g. extract level/wallet from the JSON
# slog output), add a `pipeline_stages` block under `scrape_configs`.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: oprai-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Keep only containers whose name starts with `oprai-`.
      - source_labels: ['__meta_docker_container_name']
        regex: '/oprai-.*'
        action: keep

      - source_labels: ['__meta_docker_container_name']
        regex: '/(oprai-)?(.*)'
        target_label: 'service'
        replacement: '$2'

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
