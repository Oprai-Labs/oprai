# Loki + Promtail centralised logging overlay.
#
# Compose with the main stack:
#
#     docker compose \
#         -f infra/docker-compose.yml \
#         -f infra/loki/docker-compose.loki.yml \
#         up -d
#
# Promtail scrapes container logs from the Docker socket and ships them to
# Loki. Grafana is provisioned (in infra/grafana/) to know about Loki as a
# datasource — you only need to add it once via the Grafana UI:
#   Connections → Data sources → Add → Loki → URL: http://loki:3100
#
# For production: replace the local volume with a remote object store
# (Loki natively supports S3/GCS/Azure). See loki-config.yml.

services:
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - default
    # Loki listens on 3100 internally; we don't expose it publicly. Grafana
    # talks to it over the compose network.

  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - default

volumes:
  loki_data:
