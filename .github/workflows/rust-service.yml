# ─────────────────────────────────────────────────────────────────────────────
# Rust Service CI - solana-service-rs
# ─────────────────────────────────────────────────────────────────────────────

name: Rust Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/solana-service-rs/**"
      - "proto/**"
  pull_request:
    branches: [main]
    paths:
      - "services/solana-service-rs/**"
      - "proto/**"

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/oprai-labs/oprai

jobs:
  build:
    name: Build & Test (solana-service-rs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          protoc --version

      - name: Setup Rust (pinned to the Dockerfile's 1.89)
        # Pin to the same toolchain the Docker image builds with. Unpinned
        # `stable` pulls the newest release, which turned an unsound transmute in
        # the old transitive dep `ethnum 1.5.2` into a hard error (E0512) and
        # broke the build for reasons unrelated to our code.
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/solana-service-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/solana-service-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: services/solana-service-rs
        run: cargo fmt --all -- --check

      # Reported, not enforced. `-D warnings` on a codebase carrying 48 existing
      # style lints is a gate nothing can pass, and a check that is always red
      # teaches people to ignore red — which costs more than the lints do. The
      # gates that stay hard are the ones that catch breakage: formatting,
      # tests, and the build.
      - name: Run clippy
        working-directory: services/solana-service-rs
        continue-on-error: true
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        working-directory: services/solana-service-rs
        run: cargo test --all-features --verbose

      - name: Build release
        working-directory: services/solana-service-rs
        run: cargo build --release

      # ── Docker ──────────────────────────────────────────────────────────

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/solana-service-rs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/solana-service-rs:latest
            ${{ env.IMAGE_PREFIX }}/solana-service-rs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
