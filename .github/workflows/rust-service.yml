# ─────────────────────────────────────────────────────────────────────────────
# Rust Service CI - solana-service-rs
# ─────────────────────────────────────────────────────────────────────────────

name: Rust Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/solana-service-rs/**"
      - "proto/**"
  pull_request:
    branches: [main]
    paths:
      - "services/solana-service-rs/**"
      - "proto/**"

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/oprai

jobs:
  build:
    name: Build & Test (solana-service-rs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          protoc --version

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/solana-service-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/solana-service-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: services/solana-service-rs
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: services/solana-service-rs
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: services/solana-service-rs
        run: cargo test --all-features --verbose

      - name: Build release
        working-directory: services/solana-service-rs
        run: cargo build --release

      # ── Docker ──────────────────────────────────────────────────────────

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/solana-service-rs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/solana-service-rs:latest
            ${{ env.IMAGE_PREFIX }}/solana-service-rs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
