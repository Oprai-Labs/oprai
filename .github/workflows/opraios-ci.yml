name: OpraiOS CI

on:
  push:
    branches: [main]
    paths:
      - 'opraiOS/**'
      - '.github/workflows/opraios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'opraiOS/**'
      - '.github/workflows/opraios-ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff lint
        run: |
          cd opraiOS && ruff check .

      - name: Run Ruff format check
        run: |
          cd opraiOS && ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-aiofiles
          cd opraiOS && pip install -e .

      - name: Run mypy
        run: |
          cd opraiOS && mypy --ignore-missing-imports --no-error-summary opraiOS/ || true
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          cd opraiOS && pip install -e .

      - name: Run tests with coverage
        run: |
          cd opraiOS && pytest tests/ -v --cov=opraiOS --cov-report=xml --cov-report=html --cov-fail-under=0
        env:
          PYTHONPATH: opraiOS

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: opraiOS/htmlcov/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package
        run: |
          cd opraiOS && python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: opraiOS/dist/
          retention-days: 7
