# ─────────────────────────────────────────────────────────────────────────────
# Python Services CI - chat-service-py, memory-service-py
# ─────────────────────────────────────────────────────────────────────────────

name: Python Services CI

on:
  push:
    branches: [main]
    paths:
      - "services/chat-service-py/**"
      - "services/memory-service-py/**"
      - "proto/**"
  pull_request:
    branches: [main]
    paths:
      - "services/chat-service-py/**"
      - "services/memory-service-py/**"
      - "proto/**"

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/oprai

jobs:
  build:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - chat-service-py
          - memory-service-py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true

      - name: Install proto tools
        run: pip install grpcio-tools

      - name: Generate proto stubs
        run: |
          chmod +x scripts/build-protos.sh
          ./scripts/build-protos.sh python

      - name: Lint with ruff
        working-directory: services/${{ matrix.service }}
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Run tests with pytest
        working-directory: services/${{ matrix.service }}
        run: |
          pip install pytest pytest-cov pytest-asyncio || true
          pytest -v --cov=. --cov-report=xml:coverage.xml || echo "No tests found"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

      # ── Docker ──────────────────────────────────────────────────────────

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
