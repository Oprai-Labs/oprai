# ─────────────────────────────────────────────────────────────────────────────
# Angular Frontend CI - apps/oprai
# ─────────────────────────────────────────────────────────────────────────────

name: Angular Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/oprai/**"
      - ".github/workflows/angular-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/oprai/**"
      - ".github/workflows/angular-frontend.yml"

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/oprai-labs/oprai

jobs:
  build:
    name: Lint, Test & Build (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/oprai/package-lock.json

      - name: Install dependencies
        working-directory: apps/oprai
        run: npm ci --no-audit --no-fund

      - name: Build production
        working-directory: apps/oprai
        run: npm run build:prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: apps/oprai/dist/

      # ── Docker ──────────────────────────────────────────────────────────

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      # Not pushed. Production builds every service on the server from the
      # rsynced source — nothing pulls ghcr.io/oprai-labs — so this step
      # published images no deploy has ever used, and failed while doing it.
      # Building still proves the Dockerfile works, which is the part worth
      # keeping.
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: apps/oprai
          file: apps/oprai/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/oprai-frontend:latest
            ${{ env.IMAGE_PREFIX }}/oprai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
