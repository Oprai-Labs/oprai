# ─────────────────────────────────────────────────────────────────────────────
# Angular Frontend CI - apps/oprai
# ─────────────────────────────────────────────────────────────────────────────

name: Angular Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/oprai/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/oprai/**"

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/oprai

jobs:
  build:
    name: Lint, Test & Build (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/oprai/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: apps/oprai
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/oprai
        run: pnpm exec ng lint

      - name: Run tests
        working-directory: apps/oprai
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadless

      - name: Build production
        working-directory: apps/oprai
        run: pnpm exec ng build --configuration production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: apps/oprai/dist/

      # ── Docker ──────────────────────────────────────────────────────────

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: apps/oprai
          file: apps/oprai/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/oprai-frontend:latest
            ${{ env.IMAGE_PREFIX }}/oprai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
