[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oprai-chat-service"
version = "0.1.0"
description = "OPRAI Chat Service - Python/FastAPI polyglot migration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.29.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "openai>=1.58.0",
    "anthropic>=0.40.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.2.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "qdrant-client>=1.12.0",
    "eth-account>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Markers split the eval harness so CI can gate on the cheap unit tests while
# the LLM-quality regressions (which call the real model and cost ~cents per
# run) only fire on demand or on a release branch.
markers = [
    "llm_eval: end-to-end LLM quality eval — slow, costs API credits, run on release",
    "integration: hits external services (DB, Redis, RPC); skip in CI without infra",
]
