[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oprai-tg-bot"
version = "0.1.0"
description = "OPRAI Telegram Bot - conversational DeFi over Telegram (custodial)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "redis>=5.0.0",
    "base58>=2.1.1",
    # pools.trade takes the token image inline as a PNG/WebP data URI, so we
    # convert Telegram's JPEG rather than making people leave chat to host one.
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
