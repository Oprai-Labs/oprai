<div class="clarify-card">
  <!-- Gradient hairline + tinted header + right-hand badge: the same opening
       three elements as the query and action cards, so a choice reads as one
       more mini-app rather than a chat aside. -->
  <div class="clarify-accent"></div>
  <div class="clarify-card__header">
    @if (cardProtocol(); as proto) {
      <div class="clarify-card__icon clarify-card__icon--protocol">
        <img class="clarify-card__proto-logo" [src]="proto.icon" [alt]="proto.name" />
      </div>
    } @else {
      <div class="clarify-card__icon">
        <lucide-angular [name]="icon()" [size]="16" />
      </div>
    }
    <span class="clarify-card__title">{{ cardProtocol()?.name ?? title() }}</span>
    <span class="clarify-card__badge">CHOOSE</span>
  </div>

  <!-- Question -->
  <p class="clarify-card__question">{{ clarify.question }}</p>

  <!-- Options -->
  @let mode = distinguishBy();
  <div class="clarify-card__options">
    @for (option of clarify.options; track option.action; let i = $index) {
      <button
        class="clarify-option"
        [class.clarify-option--selected]="selectedIndex === i"
        [class.clarify-option--dimmed]="selectedIndex !== null && selectedIndex !== i"
        [class.clarify-option--protocol]="hasProtocolInfo(option)"
        [style.--protocol-accent]="hasProtocolInfo(option) ? getProtocolInfo(option)?.accent : ''"
        [disabled]="selectedIndex !== null"
        (click)="select(option, i)"
      >
        <!-- Angular 19: `; as x` aliases only bind on a PRIMARY @if, never on
             an @else if — so precompute the branch values with @let. -->
        @let fullPair = optionFullPair(option);
        @let singleTok = mode === 'token' ? optionSingleToken(option) : null;
        @if (fullPair) {
          <!-- Pool/pair option (SOL/USDC): show BOTH token coins, not the
               protocol logo or just one side. -->
          <div class="clarify-option__pair">
            @if (fullPair.from.logoURI) {
              <img class="clarify-option__pair-coin" [src]="fullPair.from.logoURI" [alt]="fullPair.from.symbol" />
            } @else {
              <span class="clarify-option__pair-coin clarify-option__pair-coin--letter">{{ fullPair.from.symbol.charAt(0) }}</span>
            }
            @if (fullPair.to.logoURI) {
              <img class="clarify-option__pair-coin clarify-option__pair-coin--to" [src]="fullPair.to.logoURI" [alt]="fullPair.to.symbol" />
            } @else {
              <span class="clarify-option__pair-coin clarify-option__pair-coin--to clarify-option__pair-coin--letter">{{ fullPair.to.symbol.charAt(0) }}</span>
            }
          </div>
        } @else if (singleTok) {
          <div class="clarify-option__token-icon">
            @if (singleTok.logoURI) {
              <img [src]="singleTok.logoURI" [alt]="singleTok.symbol" />
            } @else {
              <span class="clarify-option__token-letter">{{ singleTok.symbol.charAt(0) }}</span>
            }
          </div>
        } @else if (hasProtocolInfo(option)) {
          <div class="clarify-option__protocol-icon">
            <img [src]="getProtocolInfo(option)?.icon" [alt]="option.label" />
          </div>
        } @else {
          @if (optionTokens(option); as pair) {
            <div class="clarify-option__pair">
              @if (pair.from; as t) {
                @if (t.logoURI) {
                  <img class="clarify-option__pair-coin" [src]="t.logoURI" [alt]="t.symbol" />
                } @else {
                  <span class="clarify-option__pair-coin clarify-option__pair-coin--letter">{{ t.symbol.charAt(0) }}</span>
                }
              }
              @if (pair.to; as t) {
                @if (t.logoURI) {
                  <img class="clarify-option__pair-coin clarify-option__pair-coin--to" [src]="t.logoURI" [alt]="t.symbol" />
                } @else {
                  <span class="clarify-option__pair-coin clarify-option__pair-coin--to clarify-option__pair-coin--letter">{{ t.symbol.charAt(0) }}</span>
                }
              }
            </div>
          } @else {
            <div class="clarify-option__icon">
              <lucide-angular [name]="icon()" [size]="16" />
            </div>
          }
        }

        <div class="clarify-option__content">
          <span class="clarify-option__label">{{ option.label }}</span>
          @if (option.sublabel) {
            <span class="clarify-option__sublabel">{{ option.sublabel }}</span>
          }
        </div>

        @if (selectedIndex === i) {
          <div class="clarify-option__check">
            <lucide-angular name="check" [size]="14" />
          </div>
        } @else if (selectedIndex === null) {
          <lucide-angular name="chevron-right" [size]="14" class="clarify-option__arrow" />
        }
      </button>
    }
  </div>

  @if (selectedIndex !== null) {
    <p class="clarify-card__executing">
      <lucide-angular name="loader-circle" [size]="12" class="spin" />
      Preparing transaction…
    </p>
  }
</div>
