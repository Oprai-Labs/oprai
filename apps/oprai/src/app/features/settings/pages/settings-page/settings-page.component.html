<div class="settings-page">
  <header class="settings-header">
    <h1>{{ 'Settings' | t }}</h1>
    <p class="settings-subtitle">{{ 'Manage your account, usage and preferences.' | t }}</p>
  </header>

  <div class="settings-grid">
    <section class="settings-section">
      <h2>{{ 'Account' | t }}</h2>
      <app-account-card />
    </section>

    <section class="settings-section">
      <h2>{{ 'Usage' | t }}</h2>
      <app-usage-card />
    </section>

    <section class="settings-section">
      <h2>{{ 'Appearance' | t }}</h2>
      <app-theme-switcher />
    </section>

    <section class="settings-section">
      <h2>{{ 'Privacy' | t }}</h2>
      <app-privacy-card />
    </section>
  </div>
</div>
