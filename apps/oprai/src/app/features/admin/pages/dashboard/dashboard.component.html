<app-admin-layout activePage="dashboard" (logoutClick)="logout()">
  <header class="admin-header">
    <h1>Dashboard</h1>
  </header>

  <div class="admin-content">
    @if (loading()) {
      <app-skeleton-stat-cards [count]="4" />
      <div class="charts-grid">
        <div class="stagger-5">
          <app-skeleton-chart bodyHeight="180px" [showBadge]="false" />
        </div>
        <div class="stagger-6">
          <app-skeleton-chart bodyHeight="180px" [showBadge]="false" />
        </div>
      </div>
    } @else if (error()) {
      <div class="error-state">
        <p>{{ error() }}</p>
      </div>
    } @else if (stats()) {
      <div class="content-fade-in">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Users</div>
            <div class="stat-value">{{ stats()!.totalUsers }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Sessions</div>
            <div class="stat-value">{{ stats()!.activeSessions }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Messages</div>
            <div class="stat-value">{{ stats()!.totalMessages }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Transactions</div>
            <div class="stat-value">{{ stats()!.totalTransactions }}</div>
          </div>
        </div>

        <div class="charts-grid">
          <div class="chart-card">
            <h3>Recent Activity</h3>
            <div class="chart-placeholder">
              <app-empty-state
                icon="bar-chart-3"
                title="Activity Chart"
                description="Activity chart visualization coming soon"
                variant="chart"
              />
            </div>
          </div>
          <div class="chart-card">
            <h3>User Growth</h3>
            <div class="chart-placeholder">
              <app-empty-state
                icon="users"
                title="Growth Chart"
                description="User growth chart visualization coming soon"
                variant="chart"
              />
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</app-admin-layout>
