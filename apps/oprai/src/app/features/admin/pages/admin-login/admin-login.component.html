<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-brand gradient-text">{{ 'OPRAI' | t }}</h1>
      <p class="login-subtitle">{{ 'Admin Panel' | t }}</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (error()) {
        <div class="login-error animate-slide-up">
          {{ error() | t }}
        </div>
      }

      <div class="form-group">
        <label class="label" for="username">{{ 'Username' | t }}</label>
        <div class="input-wrapper">
          <lucide-icon name="user" [size]="16" class="input-icon" />
          <input
            id="username"
            type="text"
            class="input input-with-icon"
            [(ngModel)]="username"
            name="username"
            [attr.placeholder]="'Enter username' | t"
            autocomplete="username"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="label" for="password">{{ 'Password' | t }}</label>
        <div class="input-wrapper">
          <lucide-icon name="lock" [size]="16" class="input-icon" />
          <input
            id="password"
            type="password"
            class="input input-with-icon"
            [(ngModel)]="password"
            name="password"
            [attr.placeholder]="'Enter password' | t"
            autocomplete="current-password"
            [disabled]="loading()"
          />
        </div>
      </div>

      <button
        type="submit"
        class="btn-primary login-submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="spinner"></span>
          Signing in...
        } @else {
          Sign In
        }
      </button>
    </form>
  </div>
</div>
