<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="ray-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1B43"/>
      <stop offset="100%" stop-color="#2D1A60"/>
    </linearGradient>
    <linearGradient id="ray-bar" x1="6" y1="26" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D1F8"/>
      <stop offset="100%" stop-color="#C200FB"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#ray-bg)"/>
  <!-- Raydium mark: three solid diagonal parallelogram bars sweeping
       bottom-left → top-right, cyan → magenta gradient. Each bar is the
       same width and tilt, with a small gap between them. -->
  <g fill="url(#ray-bar)">
    <path d="M11.0 22.0 L13.5 22.0 L17.0 10.0 L14.5 10.0 Z"/>
    <path d="M16.0 22.0 L18.5 22.0 L22.0 10.0 L19.5 10.0 Z"/>
    <path d="M21.0 22.0 L23.5 22.0 L27.0 10.0 L24.5 10.0 Z"/>
  </g>
</svg>
