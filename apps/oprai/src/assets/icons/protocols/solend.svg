<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="slnd-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07CEED"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <linearGradient id="slnd-inner" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07CEED" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0D1B2A"/>
  <!-- Outer ring arc (lens top) -->
  <path d="M8 16C8 11.58 11.58 8 16 8C20.42 8 24 11.58 24 16" stroke="url(#slnd-grad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Outer ring arc (lens bottom) -->
  <path d="M24 16C24 20.42 20.42 24 16 24C11.58 24 8 20.42 8 16" stroke="url(#slnd-grad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Inner filled circle -->
  <circle cx="16" cy="16" r="5.5" fill="url(#slnd-grad)"/>
  <!-- Center shine -->
  <circle cx="14.5" cy="14.5" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Left spoke -->
  <line x1="4" y1="16" x2="9.5" y2="16" stroke="url(#slnd-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Right spoke -->
  <line x1="22.5" y1="16" x2="28" y2="16" stroke="url(#slnd-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Top spoke -->
  <line x1="16" y1="4" x2="16" y2="9.5" stroke="url(#slnd-grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom spoke -->
  <line x1="16" y1="22.5" x2="16" y2="28" stroke="url(#slnd-grad)" stroke-width="2" stroke-linecap="round"/>
</svg>
