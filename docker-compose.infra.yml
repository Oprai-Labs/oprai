# Infrastructure only — for local development
# Services run natively with hot-reload via `pnpm dev`
#
# Usage: docker compose -f docker-compose.infra.yml up -d
#    or: make dev-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: oprai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${DB_SUPERPASS:?DB_SUPERPASS is required — run cp .env.example .env and configure}
      POSTGRES_DB: ${DB_SUPERDB:-oprai}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: oprai-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__HARD_LIMIT: 10737418240
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: oprai-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vault (Transit engine) — envelope encryption for the Telegram bot's
  # custodial keys. DEV MODE: in-memory, auto-unsealed, fixed root token — for
  # LOCAL DEV ONLY. Keys do not persist across restarts (test wallets only).
  # Prod runs a real, persistent, sealed Vault with a scoped token.
  # After `up`, run `make vault-init` to enable transit + create the key.
  vault:
    image: hashicorp/vault:1.18
    container_name: oprai-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-oprai-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  qdrant-storage:
  redis-data:
